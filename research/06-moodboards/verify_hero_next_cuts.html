<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hero & Next Section Cut Inspector | Link3 Research</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      padding: 24px;
    }
    header {
      background: #FFFFFF;
      padding: 18px 24px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #E2E8F0;
    }
    h1 { font-size: 20px; font-weight: 800; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
      gap: 24px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 8px;
      border: 1px solid #E2E8F0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-header {
      padding: 12px 16px;
      border-bottom: 1px solid #E2E8F0;
      background: #F1F5F9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body {
      position: relative;
      height: 600px;
      overflow-y: auto;
      background: #EEF2F6;
    }
    .card-body img {
      width: 100%;
      display: block;
    }
    .cut-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: #EF4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      z-index: 10;
      pointer-events: none;
    }
    .cut-badge {
      position: absolute;
      right: 12px;
      background: #EF4444;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      transform: translateY(-50%);
    }
    .controls {
      padding: 10px 16px;
      border-top: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }
    input[type=range] { flex: 1; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>40 Competitors: Hero & Next Section Crop Alignment</h1>
      <p style="color:#64748B; font-size:13px;">Reviewing precise boundaries (Header + Hero Banner + Next Content Section)</p>
    </div>
    <div id="stats" style="font-weight:700; color:#0284C7;">40 Sites Loaded</div>
  </header>

  <div class="grid" id="grid"></div>

  <script>
    async function init() {
      const res = await fetch('section_gap_analysis.json');
      const data = await res.json();
      const grid = document.getElementById('grid');

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // Choose best initial next_cut
        let initialCut = item.next_candidates.length > 0 ? item.next_candidates[item.next_candidates.length - 1][0] : Math.min(item.scaled_h, 2000);
        
        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">[${item.id}] ${item.name}</span>
            <span style="font-size:12px; color:#64748B;">Raw: ${item.raw_dim}</span>
          </div>
          <div class="card-body" id="body_${item.id}">
            <div class="cut-line" id="line_${item.id}">
              <span class="cut-badge" id="badge_${item.id}">Cut y: ${initialCut}px</span>
            </div>
            <img id="img_${item.id}" src="../../shareable-moodboard/screenshots/${item.fname}" alt="${item.name}">
          </div>
          <div class="controls">
            <span>Cut:</span>
            <input type="range" id="range_${item.id}" min="500" max="${item.scaled_h > 3500 ? 3500 : item.scaled_h}" value="${initialCut}">
            <span id="val_${item.id}" style="width:50px; font-weight:700;">${initialCut}px</span>
          </div>
        `;
        grid.appendChild(card);

        const img = card.querySelector(`#img_${item.id}`);
        const line = card.querySelector(`#line_${item.id}`);
        const badge = card.querySelector(`#badge_${item.id}`);
        const range = card.querySelector(`#range_${item.id}`);
        const val = card.querySelector(`#val_${item.id}`);

        function updateCut() {
          const rawY = parseInt(range.value);
          val.textContent = rawY + 'px';
          badge.textContent = 'Cut y: ' + rawY + 'px';
          // convert rawY to rendered image coordinate
          if (img.naturalHeight > 0) {
            const ratio = img.clientHeight / img.naturalHeight;
            line.style.top = (rawY * ratio) + 'px';
          }
        }

        img.onload = updateCut;
        range.oninput = updateCut;
      });
    }
    init();
  </script>
</body>
</html>
