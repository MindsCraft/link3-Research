<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claura - AI Agency Built for You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-display: 'Newsreader', Georgia, serif;
      --font-sans: 'Figtree', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      
      /* Exact Claura Palette & Canvas */
      --bg-page: #F6F3EE;
      --bg-surface: #FFFFFF;
      --bg-surface-subtle: #EDE9E1;
      --border-subtle: rgba(24, 24, 27, 0.08);
      --border-medium: rgba(24, 24, 27, 0.14);
      
      --text-primary: #18181B;
      --text-secondary: #52525B;
      --text-muted: #71717A;
      --text-accent-italic: #71717A;
      
      --accent-pill: #18181B;
      --accent-pill-hover: #2E2E33;
      --accent-pill-text: #FFFFFF;
      
      --shadow-soft: 0 10px 30px -4px rgba(24, 24, 27, 0.06);
      --shadow-elevated: 0 20px 48px -10px rgba(24, 24, 27, 0.10);
      
      /* Reverse-engineered Claura Framer Motion Parameters */
      --speed-mult: 1;
      --framer-spring-curve: cubic-bezier(0.16, 1, 0.3, 1);
      --framer-exit-curve: cubic-bezier(0.96, -0.05, 0.3, 1);
      --framer-flower-curve: cubic-bezier(0.44, 0, 0.56, 1);
      
      --duration-exit: calc(320ms * var(--speed-mult));
      --duration-spring-enter: calc(850ms * var(--speed-mult));
      --duration-flower-enter: calc(1100ms * var(--speed-mult));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Global Brand Gradients */
    .bg-hamilton {
      background: radial-gradient(circle at 65% 35%, #F59E0B 0%, #10B981 60%, #064E3B 100%) !important;
    }

    .bg-terra {
      background: radial-gradient(circle at 35% 65%, #0284C7 0%, #1E293B 75%, #0F172A 100%) !important;
    }

    /* Persistent Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(246, 243, 238, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.15rem 2.5rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.2rem;
    }

    .nav-link {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      position: relative;
      padding: 0.4rem 0;
      cursor: pointer;
      transition: color 0.2s ease;
      user-select: none;
    }

    .nav-link:hover {
      color: var(--text-primary);
    }

    .nav-link.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--text-primary);
      border-radius: 2px;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      text-decoration: none;
      cursor: pointer;
      display: inline-block;
      user-select: none;
      transition: opacity 0.2s;
    }

    .brand-logo:hover {
      opacity: 0.8;
    }

    .nav-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--accent-pill);
      color: var(--accent-pill-text);
      padding: 0.65rem 1.45rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.25s var(--framer-spring-curve);
    }

    .btn-pill:hover {
      background-color: var(--accent-pill-hover);
      transform: translateY(-1px);
    }

    .btn-secondary-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      padding: 0.65rem 1.45rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid var(--border-medium);
      cursor: pointer;
      transition: all 0.25s var(--framer-spring-curve);
    }

    .btn-secondary-pill:hover {
      background-color: var(--bg-surface-subtle);
      transform: translateY(-1px);
    }

    .section-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.35rem 0.95rem;
      background: var(--bg-surface-subtle);
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    /* Page Stage & Transition Engine */
    .page-stage {
      position: relative;
      width: 100%;
      min-height: calc(100vh - 84px);
    }

    .page-view {
      width: 100%;
      max-width: 1260px;
      margin: 0 auto;
      padding: 3.5rem 2.5rem 8rem;
    }

    /* Exiting View */
    .page-view.is-exiting {
      animation: clauraViewExit var(--duration-exit) var(--framer-exit-curve) forwards;
      pointer-events: none;
    }

    @keyframes clauraViewExit {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0.001;
        transform: translateY(-26px);
      }
    }

    /* Incoming View Spring Component (y = 170px -> 0) */
    .page-view.is-entering .claura-spring-component {
      opacity: 0.001;
      transform: translateY(170px);
      animation: clauraSpringEnter var(--duration-spring-enter) var(--framer-spring-curve) forwards;
      will-change: transform, opacity;
    }

    @keyframes clauraSpringEnter {
      0% {
        opacity: 0.001;
        transform: translateY(170px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-view.is-entering .stagger-delay-1 { animation-delay: calc(0.18s * var(--speed-mult)); }
    .page-view.is-entering .stagger-delay-2 { animation-delay: calc(0.28s * var(--speed-mult)); }
    .page-view.is-entering .stagger-delay-3 { animation-delay: calc(0.38s * var(--speed-mult)); }
    .page-view.is-entering .stagger-delay-4 { animation-delay: calc(0.48s * var(--speed-mult)); }
    .page-view.is-entering .stagger-delay-5 { animation-delay: calc(0.58s * var(--speed-mult)); }

    /* Flower Scale Entrance */
    .page-view.is-entering .claura-flower-component {
      opacity: 0.001;
      transform: scale(1.5);
      animation: clauraFlowerEnter var(--duration-flower-enter) var(--framer-flower-curve) forwards;
      animation-delay: calc(0.2s * var(--speed-mult));
      will-change: transform, opacity;
    }

    @keyframes clauraFlowerEnter {
      0% {
        opacity: 0.001;
        transform: scale(1.5);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Common Typography */
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 6.5vw, 5.2rem);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 4.5vw, 3.8rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .italic-serif {
      font-style: italic;
      color: var(--text-accent-italic);
    }

    .hero-lead-text {
      font-size: 1.18rem;
      color: var(--text-secondary);
      line-height: 1.62;
      max-width: 620px;
      margin-bottom: 2.2rem;
    }

    .section-lead-text {
      font-size: 1.12rem;
      color: var(--text-secondary);
      line-height: 1.65;
      max-width: 640px;
      margin-bottom: 2.5rem;
    }

    .hero-btn-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 3.5rem;
    }

    .split-hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 3.5rem;
      margin-bottom: 5rem;
    }

    /* Botanical Flower */
    .flower-visual-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .flower-svg-art {
      width: 100%;
      max-width: 440px;
      height: auto;
      filter: drop-shadow(0 25px 35px rgba(234, 88, 12, 0.2));
      transform-origin: center center;
    }

    /* Section Separator */
    .content-section {
      margin-top: 6rem;
      padding-top: 3rem;
    }

    /* --------------------------------------------------------------------------
       HOMEPAGE SPECIFIC STYLING
       -------------------------------------------------------------------------- */
    /* Hero Showcase Card */
    .home-hero-center {
      text-align: center;
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .home-canvas-card {
      width: 100%;
      height: 400px;
      border-radius: 28px;
      background: linear-gradient(135deg, #FDBA74 0%, #FB923C 25%, #F43F5E 55%, #6366F1 85%, #3B82F6 100%);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-elevated);
      margin-bottom: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .home-canvas-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.75) 2.5px, transparent 2.5px);
      background-size: 26px 26px;
      mix-blend-mode: overlay;
    }

    .home-canvas-inner {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #FFFFFF;
      padding: 2rem;
    }

    .home-canvas-title {
      font-family: var(--font-display);
      font-size: 3rem;
      font-style: italic;
      margin-bottom: 0.5rem;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
    }

    .home-canvas-desc {
      font-size: 1.05rem;
      opacity: 0.95;
      font-weight: 500;
    }

    /* Client logos */
    .client-cloud-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .client-cloud-caption {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .client-cloud-logos {
      display: flex;
      gap: 3.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .client-cloud-logo {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-secondary);
      opacity: 0.7;
    }

    /* Stats Card Banner */
    .stats-card-banner {
      width: 100%;
      background: radial-gradient(circle at 50% 50%, #F59E0B 0%, #0F766E 60%, #134E4A 100%);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow-elevated);
      margin-top: 2rem;
    }

    .stats-card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .stat-glass-card {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      padding: 2.2rem 1.8rem;
      color: #FFFFFF;
      text-align: center;
    }

    .stat-number {
      font-family: var(--font-display);
      font-size: 3.2rem;
      line-height: 1;
      margin-bottom: 0.6rem;
    }

    .stat-label {
      font-size: 0.9rem;
      opacity: 0.95;
      line-height: 1.35;
    }

    /* Hiring banner pill */
    .hiring-bar {
      margin-top: 1.8rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 1.2rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      box-shadow: var(--shadow-soft);
    }

    .hiring-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .hiring-tag {
      background: #DCFCE7;
      color: #15803D;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
    }

    /* 4-Step Process Services Grid */
    .process-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-top: 2.5rem;
    }

    .process-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 2.2rem 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 280px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.25s var(--framer-spring-curve), box-shadow 0.25s ease;
    }

    .process-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-elevated);
      border-color: var(--border-medium);
    }

    .process-num {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .process-card-title {
      font-family: var(--font-display);
      font-size: 1.9rem;
      margin-bottom: 0.8rem;
      color: var(--text-primary);
    }

    .process-card-desc {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    /* Testimonial Quote Card */
    .testimonial-banner {
      margin-top: 2.5rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 26px;
      padding: 3rem;
      box-shadow: var(--shadow-soft);
      position: relative;
    }

    .testimonial-quote {
      font-family: var(--font-display);
      font-size: 1.85rem;
      line-height: 1.35;
      color: var(--text-primary);
      margin-bottom: 1.8rem;
      max-width: 860px;
    }

    .testimonial-author {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .author-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #F97316, #EC4899);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 1rem;
    }

    .author-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .author-role {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* How We Work 3-Step Timeline */
    .timeline-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 2.5rem;
    }

    .timeline-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 2.4rem 2rem;
      box-shadow: var(--shadow-soft);
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .timeline-step {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .timeline-duration {
      font-size: 0.8rem;
      background: var(--bg-surface-subtle);
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .timeline-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
    }

    .timeline-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Comparison Table (Other agencies vs Claura) */
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-top: 2.5rem;
    }

    .comparison-card {
      border-radius: 26px;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .comparison-card.other {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-soft);
    }

    .comparison-card.claura {
      background: #18181B;
      color: #FFFFFF;
      box-shadow: var(--shadow-elevated);
    }

    .comparison-pill {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.2rem;
    }

    .comparison-card.other .comparison-pill { color: var(--text-muted); }
    .comparison-card.claura .comparison-pill { color: #A1A1AA; }

    .comparison-title {
      font-family: var(--font-display);
      font-size: 2.6rem;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    .comparison-desc {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .comparison-card.other .comparison-desc { color: var(--text-secondary); }
    .comparison-card.claura .comparison-desc { color: #D4D4D8; }

    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .checklist-icon-bad {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FEE2E2;
      color: #DC2626;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .checklist-icon-good {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #059669;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    /* Featured Case Study Card */
    .case-spotlight-card {
      background: var(--bg-surface);
      border-radius: 28px;
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      margin-top: 2.5rem;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: transform 0.25s var(--framer-spring-curve), box-shadow 0.25s ease;
    }

    .case-spotlight-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-elevated);
      border-color: var(--border-medium);
    }

    .case-spotlight-content {
      padding: 3.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .case-spotlight-metrics {
      display: flex;
      gap: 2.5rem;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-subtle);
    }

    .spotlight-metric-val {
      font-family: var(--font-display);
      font-size: 3rem;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 0.35rem;
    }

    .spotlight-metric-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .case-spotlight-visual {
      background: radial-gradient(circle at 65% 35%, #F59E0B 0%, #10B981 60%, #064E3B 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Team Grid */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.8rem;
      margin-top: 2.5rem;
    }

    .team-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow-soft);
    }

    .team-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg-surface-subtle);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .team-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .team-role {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Accordion FAQ */
    .faq-container {
      max-width: 840px;
      margin: 2.5rem auto 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .faq-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);

    }

    @keyframes hudPulse {

    .hud-info {

  <!-- ROUTING & INTERACTION LOGIC -->
  <script>
    (function () {
      const stage = document.getElementById('stage');
      const hudDot = document.getElementById('hud-dot');
      const hudStatus = document.getElementById('hud-status');
      
      let currentRoute = 'home';
      let isBusy = false;
      let speedMult = 1;

      // Speed controller buttons
      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          speedMult = parseFloat(btn.dataset.speed);
          document.documentElement.style.setProperty('--speed-mult', speedMult);
          hudStatus.textContent = `IDLE (Multiplier: ${speedMult}x)`;
        });
      });

      // Update Nav active status
      function updateNav(route) {
        document.querySelectorAll('.nav-link').forEach(link => {
          const r = link.getAttribute('data-route');
          if (r === route || (route.startsWith('detail-') && r === 'cases')) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      }

      function createView(route) {
        const viewEl = document.createElement('div');
        viewEl.className = 'page-view';
        viewEl.id = 'current-view';

        let tpl = document.getElementById(`tpl-${route}`);
        if (!tpl) tpl = document.getElementById('tpl-home');

        viewEl.appendChild(tpl.content.cloneNode(true));
        return viewEl;
      }

      // Replicates the exact Framer Motion transition
      async function navigateTo(route, isInitial = false) {
        if (!isInitial && (isBusy || route === currentRoute)) return;
        isBusy = true;
        currentRoute = route;
        updateNav(route);

        if (window.location.hash !== `#${route}`) {
          history.pushState(null, '', `#${route}`);
        }

        const exitTime = 320 * speedMult;
        const enterTime = 900 * speedMult;

        // 1. PHASE 1: EXIT CURRENT VIEW
        const currentView = document.getElementById('current-view');
        if (!isInitial && currentView) {
          hudDot.classList.add('animating');
          hudStatus.textContent = `EXITING (320ms curve [.96, -.05, .3, 1])`;
          currentView.classList.remove('is-entering');
          currentView.classList.add('is-exiting');
          await new Promise(res => setTimeout(res, exitTime));
          currentView.remove();
        } else if (currentView) {
          currentView.remove();
        }

        // 2. SCROLL RESET
        window.scrollTo({ top: 0, behavior: 'instant' });

        // 3. PHASE 2: MOUNT INCOMING VIEW WITH EXACT SPRING (y: 170px -> 0)
        hudDot.classList.add('animating');
        hudStatus.textContent = `ENTERING (Spring: mass=0.3, k=121, c=27, y: 170px → 0)`;

        const newView = createView(route);
        newView.classList.add('is-entering');
        stage.appendChild(newView);

        // Wait for settle
        await new Promise(res => setTimeout(res, enterTime));

        // 4. SETTLED
        hudDot.classList.remove('animating');
        hudStatus.textContent = `IDLE (Δy: 170px • k: 121 • c: 27)`;
        isBusy = false;
      }

      // GLOBAL DELEGATION: Navigation & Interactive elements
      document.addEventListener('click', (e) => {
        // 1. Route links
        const trigger = e.target.closest('[data-route]');
        if (trigger) {
          e.preventDefault();
          const route = trigger.getAttribute('data-route');
          if (route) navigateTo(route);
          return;
        }

        // 2. FAQ Accordion Toggle
        const faqHeader = e.target.closest('.faq-question');
        if (faqHeader) {
          const item = faqHeader.closest('.faq-item');
          if (item) item.classList.toggle('open');
          return;
        }

        // 3. Selectable Assessment Pills
        const selectPill = e.target.closest('.select-pill');
        if (selectPill) {
          selectPill.classList.toggle('active');
          return;
        }
      });

      window.addEventListener('popstate', () => {
        const hash = window.location.hash.replace('#', '') || 'home';
        if (hash !== currentRoute) {
          navigateTo(hash);
        }
      });

      window.addEventListener('hashchange', () => {
        const hash = window.location.hash.replace('#', '') || 'home';
        if (hash !== currentRoute) {
          navigateTo(hash);
        }
      });

      window.navigateTo = navigateTo;

      // Initial Mount
      const initialHash = window.location.hash.replace('#', '') || 'home';
      navigateTo(initialHash, true);
    })();
  </script>
